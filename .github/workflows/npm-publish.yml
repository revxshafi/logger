name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # lets npm trade a GitHub OIDC token for a short-lived registry
      # credential, so no NPM_TOKEN secret is involved
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
      # trusted publishing needs npm 11.5.1+; Node 22 bundles an older npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish
